<p><strong>方案复核。</strong> 两份独立候选分别比较了 SDK 同主进程和独立执行进程。独立评审支持收窄后的执行进程方案，并要求保留最后已知快照、核对 shell 进程树、承认 sidecar 与 Pi 历史没有联合事务。最终复核补充并确认了两项修订：重启时旧命令退出未确认则保持执行锁；显式配置 SDK 工具串行，并加入验收项。</p><p class="fine">同模型家族的独立静态评审未发现剩余设计阻断项。跨家族 Kimi 审查在认证阶段失败，未产生评审结果。页面已检查桌面与手机布局、场景交互、源码检索和浏览器错误；25 处源码证据绑定本地固定提交。应用尚未实现，真实模型、命令取消与崩溃恢复仍需按发布门槛验收。</p>
